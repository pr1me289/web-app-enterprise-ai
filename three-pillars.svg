<svg viewBox="0 0 680 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pillars-title pillars-desc">
  <title id="pillars-title">Three pillars framework</title>
  <desc id="pillars-desc">Three classical drawn columns, each labeled with a pillar name and short caption, sitting on a shared stylobate.</desc>

  <style>
    .p-fill { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; stroke-linejoin: round; }
    .p-fluting { stroke: #1a1a1a; stroke-width: 0.5; opacity: 0.5; fill: none; }
    .p-ring { stroke: #1a1a1a; stroke-width: 0.7; fill: none; }
    .p-label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #1a1a1a; text-anchor: middle; letter-spacing: 0.12em; }
    .p-cap { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6b6b6b; text-anchor: middle; }
    .p-num { font-family: ui-serif, Georgia, serif; font-size: 14px; fill: #6b6b6b; text-anchor: middle; opacity: 0.55; font-style: italic; letter-spacing: 0.1em; }
  </style>

  <!-- Shared stylobate (base platform) -->
  <rect x="40" y="340" width="600" height="18" class="p-fill"/>

  <!-- Pillar I -->
  <g>
    <rect x="55" y="325" width="120" height="15" class="p-fill"/>
    <path d="M 68 325 L 75 315 L 155 315 L 162 325 Z" class="p-fill"/>
    <rect x="75" y="85" width="80" height="230" class="p-fill"/>
    <line x1="86" y1="88" x2="86" y2="312" class="p-fluting"/>
    <line x1="97" y1="88" x2="97" y2="312" class="p-fluting"/>
    <line x1="108" y1="88" x2="108" y2="312" class="p-fluting"/>
    <line x1="122" y1="88" x2="122" y2="312" class="p-fluting"/>
    <line x1="133" y1="88" x2="133" y2="312" class="p-fluting"/>
    <line x1="144" y1="88" x2="144" y2="312" class="p-fluting"/>
    <line x1="75" y1="88" x2="155" y2="88" class="p-ring"/>
    <path d="M 75 85 L 68 75 L 162 75 L 155 85 Z" class="p-fill"/>
    <rect x="55" y="60" width="120" height="15" class="p-fill"/>
    <text x="115" y="205" class="p-num">I</text>
    <text x="115" y="390" class="p-label">Purpose</text>
    <text x="115" y="410" class="p-cap">Why we exist</text>
  </g>

  <!-- Pillar II -->
  <g>
    <rect x="280" y="325" width="120" height="15" class="p-fill"/>
    <path d="M 293 325 L 300 315 L 380 315 L 387 325 Z" class="p-fill"/>
    <rect x="300" y="85" width="80" height="230" class="p-fill"/>
    <line x1="311" y1="88" x2="311" y2="312" class="p-fluting"/>
    <line x1="322" y1="88" x2="322" y2="312" class="p-fluting"/>
    <line x1="333" y1="88" x2="333" y2="312" class="p-fluting"/>
    <line x1="347" y1="88" x2="347" y2="312" class="p-fluting"/>
    <line x1="358" y1="88" x2="358" y2="312" class="p-fluting"/>
    <line x1="369" y1="88" x2="369" y2="312" class="p-fluting"/>
    <line x1="300" y1="88" x2="380" y2="88" class="p-ring"/>
    <path d="M 300 85 L 293 75 L 387 75 L 380 85 Z" class="p-fill"/>
    <rect x="280" y="60" width="120" height="15" class="p-fill"/>
    <text x="340" y="205" class="p-num">II</text>
    <text x="340" y="390" class="p-label">People</text>
    <text x="340" y="410" class="p-cap">Who does the work</text>
  </g>

  <!-- Pillar III -->
  <g>
    <rect x="505" y="325" width="120" height="15" class="p-fill"/>
    <path d="M 518 325 L 525 315 L 605 315 L 612 325 Z" class="p-fill"/>
    <rect x="525" y="85" width="80" height="230" class="p-fill"/>
    <line x1="536" y1="88" x2="536" y2="312" class="p-fluting"/>
    <line x1="547" y1="88" x2="547" y2="312" class="p-fluting"/>
    <line x1="558" y1="88" x2="558" y2="312" class="p-fluting"/>
    <line x1="572" y1="88" x2="572" y2="312" class="p-fluting"/>
    <line x1="583" y1="88" x2="583" y2="312" class="p-fluting"/>
    <line x1="594" y1="88" x2="594" y2="312" class="p-fluting"/>
    <line x1="525" y1="88" x2="605" y2="88" class="p-ring"/>
    <path d="M 525 85 L 518 75 L 612 75 L 605 85 Z" class="p-fill"/>
    <rect x="505" y="60" width="120" height="15" class="p-fill"/>
    <text x="565" y="205" class="p-num">III</text>
    <text x="565" y="390" class="p-label">Process</text>
    <text x="565" y="410" class="p-cap">How it gets done</text>
  </g>
</svg>
